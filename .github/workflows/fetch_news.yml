name: MixFruit Engine Pipeline

on:
  schedule:
    - cron: '0 * * * *' # Wakes up at the top of every hour
  workflow_dispatch: # This creates the "Run workflow" button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install Tools
        run: pip install -r requirements.txt

      - name: Phase 3: Fetch RSS (p1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python engine.py

      - name: Stealth Gap: Randomized Wait (25-45 mins)
        run: python -c "import random, time; delay = random.randint(1500, 2700); print(f'Engine resting for {delay//60} minutes...'); time.sleep(delay)"

      - name: Phase 5: Validate Approved (p2 -> p3)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python validate.py
