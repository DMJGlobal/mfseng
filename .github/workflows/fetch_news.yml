name: MixFruit Engine Pipeline

on:
  schedule:
    - cron: '0 * * * *' # Wakes up at the top of every hour
  workflow_dispatch: # Manual trigger for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install Tools
        run: pip install -r requirements.txt

      - name: Phase 3: Fetch RSS (p1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python engine.py

      - name: Stealth Gap: Randomized Wait (25-45 mins)
        run: |
          # Calculate random seconds between 1500 (25m) and 2700 (45m)
          MIN_SEC=1500
          MAX_SEC=2700
          DELAY_SEC=$(( (RANDOM % (MAX_SEC - MIN_SEC + 1)) + MIN_SEC ))
          echo "Phase 3 complete. Engine is resting for $((DELAY_SEC / 60)) minutes to remain stealthy..."
          sleep $DELAY_SEC

      - name: Phase 5: Validate Approved (p2 -> p3)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python validate.py
