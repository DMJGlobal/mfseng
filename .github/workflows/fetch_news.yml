name: "MixFruit Engine Pipeline"

# PLACE THIS HERE:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: "Install Tools"
        run: pip install -r requirements.txt

      - name: "Phase 3: Fetch RSS (p1)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RSS_FEEDS_LIST: ${{ secrets.RSS_FEEDS_LIST }}
        run: python engine.py

      - name: "Stealth Gap: Randomized Wait (25-45 mins)"
        run: python -c "import random, time; delay = random.randint(1500, 2700); print(f'Engine resting for {delay//60} minutes...'); time.sleep(delay)"

      - name: "Phase 5: Validate Approved (p2 -> p3)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python validate.py

      - name: "Phase 7: Deep Intel Scour (p4 -> p5)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scour.py

    - name: "Phase 8: Write Full Draft (p5 -> p6)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SME_PERSONAS: ${{ secrets.SME_PERSONAS }}
          ANTI_AI_SLOP_GUIDELINES: ${{ secrets.ANTI_AI_SLOP_GUIDELINES }}
          MASTER_CATEGORY_MAP: ${{ secrets.MASTER_CATEGORY_MAP }}
          TITLE_DIRECTIVES: ${{ secrets.TITLE_DIRECTIVES }} # <-- ADD THIS LINE
        run: python draft.py
